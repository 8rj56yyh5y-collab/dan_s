# Постоянная ссылка на Render.com (Blueprint): Dashboard → New → Blueprint → выбрать этот репозиторий.
# Тариф Starter + диск 1 ГБ: работает 24/7, заявки, чеки и журнал сохраняются.
# Бесплатный тариф без диска не подходит: при перезапуске теряются все данные.
services:
  - type: web
    name: bh-uchet
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "npm install --omit=dev"
    startCommand: npm start
    healthCheckPath: /api/meta
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: HEAD_LOGIN
        sync: false
      - key: HEAD_PASSWORD
        sync: false
      - key: HEAD_NAME
        sync: false
      # Распознавание чеков ИИ (необязательно):
      - key: ANTHROPIC_API_KEY
        sync: false
